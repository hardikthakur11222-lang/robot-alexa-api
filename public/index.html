<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Robot Control API</title>
<style>
*{box-sizing:border-box}
body{
    margin:0;
    min-height:100vh;
    font-family:Inter,Arial,sans-serif;
    background:#0b1120;
    color:#f8fafc;
    display:flex;
    justify-content:center;
    align-items:center;
}
.app{
    width:min(1050px,94vw);
    padding:28px;
    background:#111827;
    border:1px solid #263244;
    border-radius:22px;
    box-shadow:0 25px 70px rgba(0,0,0,.4);
}
.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
    margin-bottom:22px;
}
h1{margin:0;font-size:28px}
.subtitle{color:#94a3b8;margin-top:6px}
.status{
    padding:9px 13px;
    border-radius:999px;
    background:#064e3b;
    color:#a7f3d0;
    font-size:13px;
    white-space:nowrap;
}
.layout{
    display:grid;
    grid-template-columns:1fr 300px;
    gap:22px;
}
.world{
    height:520px;
    position:relative;
    overflow:hidden;
    border-radius:17px;
    border:1px solid #334155;
    background-color:#0f172a;
    background-image:
      linear-gradient(#1e293b 1px,transparent 1px),
      linear-gradient(90deg,#1e293b 1px,transparent 1px);
    background-size:40px 40px;
}
.robot{
    width:64px;
    height:64px;
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    border-radius:14px;
    background:#2563eb;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:30px;
    box-shadow:0 0 28px rgba(37,99,235,.65);
    transition:left .2s ease,top .2s ease;
}
.panel{
    padding:22px;
    border-radius:17px;
    border:1px solid #334155;
    background:#0f172a;
}
.panel h2{margin-top:0;font-size:19px}
.controls{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin-top:18px;
}
button{
    height:62px;
    border:0;
    border-radius:12px;
    color:#fff;
    background:#334155;
    font-size:24px;
    cursor:pointer;
    transition:.12s;
}
button:hover{filter:brightness(1.15)}
button:active{transform:scale(.96)}
.forward{grid-column:2;background:#16a34a}
.left{grid-column:1;background:#2563eb}
.stop{grid-column:2;background:#d97706;font-size:15px;font-weight:700}
.right{grid-column:3;background:#2563eb}
.backward{grid-column:2;background:#dc2626}
.info{
    margin-top:22px;
    padding:14px;
    border-radius:12px;
    background:#111827;
    border:1px solid #1e293b;
}
.label{color:#94a3b8;font-size:12px}
.value{margin-top:5px;font-weight:700}
.api{
    margin-top:18px;
    font-size:12px;
    color:#64748b;
    word-break:break-all;
}
@media(max-width:750px){
    .layout{grid-template-columns:1fr}
    .world{height:420px}
    .header{align-items:flex-start;flex-direction:column}
}
</style>
</head>
<body>
<div class="app">
    <div class="header">
        <div>
            <h1>🤖 Robot Control</h1>
            <div class="subtitle">Web controls + Alexa-ready REST API</div>
        </div>
        <div class="status" id="status">● API ONLINE</div>
    </div>

    <div class="layout">
        <div class="world" id="world">
            <div class="robot" id="robot">🤖</div>
        </div>

        <div class="panel">
            <h2>Controls</h2>

            <div class="controls">
                <button class="forward" onclick="moveRobot('forward')">↑</button>
                <button class="left" onclick="moveRobot('left')">←</button>
                <button class="stop" onclick="moveRobot('stop')">STOP</button>
                <button class="right" onclick="moveRobot('right')">→</button>
                <button class="backward" onclick="moveRobot('backward')">↓</button>
            </div>

            <div class="info">
                <div class="label">LAST COMMAND</div>
                <div class="value" id="command">STOP</div>
            </div>

            <div class="info">
                <div class="label">API RESPONSE</div>
                <div class="value" id="response">Waiting...</div>
            </div>

            <div class="api">
                POST /api/move
            </div>
        </div>
    </div>
</div>

<script>
const robot = document.getElementById("robot");
const commandEl = document.getElementById("command");
const responseEl = document.getElementById("response");
const statusEl = document.getElementById("status");

let x = 50;
let y = 50;
const step = 5;

function updateRobot(direction){
    if(direction === "forward") y -= step;
    if(direction === "backward") y += step;
    if(direction === "left") x -= step;
    if(direction === "right") x += step;

    x = Math.max(7, Math.min(93, x));
    y = Math.max(7, Math.min(93, y));

    robot.style.left = x + "%";
    robot.style.top = y + "%";
}

async function moveRobot(direction){
    commandEl.textContent = direction.toUpperCase();

    if(direction !== "stop"){
        updateRobot(direction);
    }

    try{
        const response = await fetch("/api/move", {
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({direction})
        });

        const data = await response.json();

        if(!response.ok){
            throw new Error(data.error || "API error");
        }

        responseEl.textContent = data.message;
        statusEl.textContent = "● API ONLINE";
        statusEl.style.background = "#064e3b";
    }catch(error){
        responseEl.textContent = error.message;
        statusEl.textContent = "● API ERROR";
        statusEl.style.background = "#7f1d1d";
    }
}

async function checkHealth(){
    try{
        const response = await fetch("/api/health");
        if(!response.ok) throw new Error();
        statusEl.textContent = "● API ONLINE";
        statusEl.style.background = "#064e3b";
    }catch{
        statusEl.textContent = "● API OFFLINE";
        statusEl.style.background = "#7f1d1d";
    }
}

checkHealth();
</script>
</body>
</html>
